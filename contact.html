<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Jahanzaib Cotton and Towel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <nav class="bg-white border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-xl">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div>
                        <span class="block text-xl font-bold font-serif text-slate-900">Jahanzaib</span>
                        <span class="block text-xs uppercase tracking-widest font-bold text-teal-600">Cotton & Towel</span>
                    </div>
                </a>
                <div class="flex items-center gap-6 font-medium text-slate-700 text-sm">
                    <a href="index.html" class="hover:text-teal-600">Home</a>
                    <a href="products.html" class="hover:text-teal-600">Towels Catalog</a>
                    <a href="contact.html" class="text-teal-600 font-bold">Contact Us</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="bg-white rounded-3xl border border-stone-200 shadow-lg p-8 sm:p-12 space-y-8">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-serif font-bold text-slate-900">Contact Muhammad Jahanzaib</h1>
                <p class="text-slate-600 text-sm">For bulk inquiries, custom orders, or instant purchases, reach out to us directly.</p>
            </div>

            <div class="grid sm:grid-cols-2 gap-6">
                <a href="https://wa.me/923097279372" target="_blank" class="p-6 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center gap-4 hover:bg-emerald-100/80 transition-colors">
                    <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-2xl">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div>
                        <span class="block text-xs font-bold text-emerald-800 uppercase">WhatsApp</span>
                        <span class="text-lg font-bold text-slate-900">0309-7279372</span>
                    </div>
                </a>

                <a href="mailto:jahanzaibtayyab84@gmail.com" class="p-6 rounded-2xl bg-teal-50 border border-teal-200 flex items-center gap-4 hover:bg-teal-100/80 transition-colors">
                    <div class="w-12 h-12 rounded-xl bg-teal-600 text-white flex items-center justify-center text-xl">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <span class="block text-xs font-bold text-teal-800 uppercase">Email</span>
                        <span class="text-sm font-bold text-slate-900 break-all">jahanzaibtayyab84@gmail.com</span>
                    </div>
                </a>
            </div>

            <form onsubmit="sendFormWhatsApp(event)" class="space-y-4 pt-4 border-t border-stone-200">
                <h3 class="font-bold text-slate-900">Direct Message Generator</h3>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Your Name</label>
                    <input type="text" id="senderName" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-teal-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Message / Order Requirements</label>
                    <textarea id="senderMsg" rows="4" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-teal-600" placeholder="Type quantity or questions..."></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Send via WhatsApp</span>
                </button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
